<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liberation Coach — Website Concepts (v10)</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bar:#14151a;--bar2:#1d1f27;--line:#2c2f3a;--txt:#e7e8ee;--mut:#9ca0ad;--acc:#EFCB30}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0c0d11;color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
  /* top bar */
  .bar{flex:0 0 auto;background:var(--bar);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 18px}
  .title{font-weight:700;font-size:14.5px;letter-spacing:.01em;white-space:nowrap}
  .title span{color:var(--mut);font-weight:400}
  .group{display:flex;align-items:center;gap:6px;background:var(--bar2);border:1px solid var(--line);
    border-radius:10px;padding:4px}
  .group.designs{flex-wrap:wrap}
  .btn{border:0;background:transparent;color:var(--mut);font-size:13px;font-weight:600;
    padding:8px 14px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;font-family:inherit}
  .btn small{display:block;font-weight:400;font-size:10.5px;opacity:.7;margin-top:1px}
  .btn:hover{color:var(--txt)}
  .btn.on{background:var(--acc);color:#231a00}
  .btn.on small{opacity:.8}
  .vp .btn.on{background:#3a4254;color:#fff}
  .spacer{flex:1 1 auto}
  .ext{color:var(--mut);font-size:12.5px;text-decoration:none;white-space:nowrap;border:1px solid var(--line);
    padding:8px 12px;border-radius:8px}
  .ext:hover{color:var(--txt);border-color:var(--mut)}
  .note{flex:0 0 auto;background:var(--bar2);border-bottom:1px solid var(--line);color:var(--mut);
    font-size:12px;line-height:1.5;padding:8px 18px}
  .note b{color:var(--txt)}
  /* stage */
  .stage{flex:1 1 auto;position:relative;overflow:auto;background:#0c0d11;display:flex;justify-content:center}
  .stage.desktop{padding:0}
  .stage.mobile{padding:22px 0}
  .frameWrap{width:100%;height:100%;display:flex;justify-content:center}
  .stage.mobile .frameWrap{align-items:flex-start}
  .phone{width:390px;max-width:92vw;height:844px;max-height:calc(100vh - 160px);
    border:10px solid #23262f;border-radius:34px;overflow:hidden;box-shadow:0 20px 60px -20px #000;background:#000;flex:0 0 auto}
  iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .stage.desktop iframe{height:100%}
  @media (max-width:640px){
    .title{font-size:13px}
    .note{display:none}
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="title">Liberation Coach <span>· Website Concepts</span></div>
    <div class="group designs" id="designs">
      <button class="btn on" data-src="design-1-forum.html">1 · Forum<small>Navy &amp; Gold · association</small></button>
      <button class="btn" data-src="design-2-institute.html">2 · Institute<small>Charcoal &amp; Amber · editorial</small></button>
      <button class="btn" data-src="design-3-maverick.html">3 · Maverick<small>Indigo &amp; Yellow · bold</small></button>
    </div>
    <div class="group vp" id="viewport">
      <button class="btn on" data-vp="desktop">Desktop</button>
      <button class="btn" data-vp="mobile">Mobile</button>
    </div>
    <div class="spacer"></div>
    <a class="ext" id="openNew" href="design-1-forum.html" target="_blank" rel="noopener">Open full ↗</a>
  </div>
  <div class="note">Three homepage directions for Liberation Coach — each patterned after a different reference site's structure. Toggle <b>Desktop / Mobile</b>. Photos are Victor's own; generic scene images are labelled placeholders until finals.</div>
  <div class="stage desktop" id="stage">
    <div class="frameWrap" id="wrap">
      <iframe id="frame" src="design-1-forum.html" title="Liberation Coach concept"></iframe>
    </div>
  </div>

<script>
  var src="design-1-forum.html", vp="desktop";
  var frame=document.getElementById('frame'), wrap=document.getElementById('wrap'),
      stage=document.getElementById('stage'), openNew=document.getElementById('openNew');
  function render(){
    stage.className='stage '+vp;
    if(vp==='mobile'){ wrap.innerHTML='<div class="phone"><iframe id="frame"></iframe></div>'; }
    else { wrap.innerHTML='<iframe id="frame"></iframe>'; }
    var f=document.getElementById('frame'); f.title='Liberation Coach concept'; f.src=src;
    openNew.href=src;
  }
  document.getElementById('designs').addEventListener('click',function(e){
    var b=e.target.closest('.btn'); if(!b)return;
    [].forEach.call(this.querySelectorAll('.btn'),x=>x.classList.remove('on')); b.classList.add('on');
    src=b.dataset.src; render();
  });
  document.getElementById('viewport').addEventListener('click',function(e){
    var b=e.target.closest('.btn'); if(!b)return;
    [].forEach.call(this.querySelectorAll('.btn'),x=>x.classList.remove('on')); b.classList.add('on');
    vp=b.dataset.vp; render();
  });
  render();
</script>
</body>
</html>
